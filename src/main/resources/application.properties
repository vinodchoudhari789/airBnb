spring.application.name=airBnbApp

#DB Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/airBnb
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Default Path Configuration
server.servlet.context-path=/api/v1

jwt.secretKey=AAA

frontend.url=http://localhost:5173

stripe.secret.key=BBB
stripe.webhook.secret=CCC

#Access swagger docs
#http://localhost:8080/api/v1/v3/api-docs
#http://localhost:8080/api/v1/swagger-ui/index.html
# Development performance profiling
# Enable to log SQL count, individual query execution time, total DB time and total API time per request.
# Disable in production unless explicitly required.
performance.query-profiling.enabled=true

# Hibernate statistics (useful for entity/query diagnostics during development)
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG

# JDBC batching - groups inserts/updates into fewer round trips instead of
# one statement per row. Most impactful for bulk operations: inventory
# initialization (rooms x days), PricingUpdateService's saveAll() calls,
# and multi-guest booking inserts.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Batches inserts into JDBC's rewritten multi-row form on Postgres, which is
# required for hibernate.jdbc.batch_size to actually reduce round trips here.
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

