spring.application.name=airBnbApp

#DB Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/airBnb
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Default Path Configuration
server.servlet.context-path=/api/v1

jwt.secretKey=AAA

frontend.url=http://localhost:5173

stripe.secret.key=BBB
stripe.webhook.secret=CCC

#Access swagger docs
#http://localhost:8080/api/v1/v3/api-docs
#http://localhost:8080/api/v1/swagger-ui/index.html
# Development performance profiling
# Enable to log SQL count, individual query execution time, total DB time and total API time per request.
# Disable in production unless explicitly required.
performance.query-profiling.enabled=true

# Hibernate statistics (useful for entity/query diagnostics during development)
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG

