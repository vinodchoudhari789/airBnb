spring.application.name=airBnbApp

#DB Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST_URL}:5432/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# validate instead of update: don't let Hibernate auto-alter the schema in prod
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

#Default Path Configuration
server.servlet.context-path=/api/v1

jwt.secretKey=${JWT_SECRET_KEY}

frontend.url=${FRONTEND_URL}

stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# Performance profiling / hibernate stats - off in prod (log noise + overhead)
performance.query-profiling.enabled=false
spring.jpa.properties.hibernate.generate_statistics=false
logging.level.org.hibernate.stat=WARN

# JDBC batching - groups inserts/updates into fewer round trips instead of
# one statement per row. Most impactful for bulk operations: inventory
# initialization (rooms x days), PricingUpdateService's saveAll() calls,
# and multi-guest booking inserts.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Batches inserts into JDBC's rewritten multi-row form on Postgres, which is
# required for hibernate.jdbc.batch_size to actually reduce round trips here.
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
